name: UI Smoke Test

on:
  pull_request:
    paths:
      - 'cmd/xferdb-web/**'
  workflow_dispatch:

jobs:
  ui-smoke-test:
    runs-on: rocky9.8
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        env:
          GIT_SSL_NO_VERIFY: "true"

      - name: Install dependencies
        shell: bash
        run: dnf install -y python3 >/dev/null

      - name: Trigger Jenkins UI smoke test
        id: trigger
        shell: bash
        env:
          JENKINS_URL: ${{ vars.JENKINS_URL }}
          JENKINS_USER: ${{ vars.JENKINS_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_TOKEN }}
          XFERDB_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail

          echo "Testing ref: $XFERDB_REF"

          # Trigger Jenkins build with smoke test suite
          echo "Triggering Jenkins UI smoke test..."
          resp=$(curl -sS -i -u "$JENKINS_USER:$JENKINS_TOKEN" \
            -X POST "$JENKINS_URL/job/NextDevOps/job/XferDB/job/xferdb-ui/buildWithParameters" \
            --data-urlencode "XFERDB_REF=$XFERDB_REF" \
            --data-urlencode "TEST_SUITE=smoke")
          QUEUE_URL=$(printf '%s' "$resp" | grep -i '^Location:' | awk '{print $2}' | tr -d '\r')

          if [ -z "$QUEUE_URL" ]; then
            echo "Could not read a queue URL from the Jenkins trigger response:"
            printf '%s\n' "$resp"
            exit 1
          fi

          echo "Queue URL: $QUEUE_URL"

          # Wait for build to start and get build URL
          echo "Waiting for build to start..."
          BUILD_URL=""
          for i in $(seq 1 30); do
            BUILD_URL=$(curl -sS -u "$JENKINS_USER:$JENKINS_TOKEN" "${QUEUE_URL}api/json" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print((d.get('executable') or {}).get('url',''))")
            [ -n "$BUILD_URL" ] && break
            sleep 5
          done

          if [ -z "$BUILD_URL" ]; then
            echo "Timeout waiting for build to start"
            exit 1
          fi

          BUILD_NUM=$(curl -sS -u "$JENKINS_USER:$JENKINS_TOKEN" "${QUEUE_URL}api/json" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print((d.get('executable') or {}).get('number',''))")

          echo "Build started: #$BUILD_NUM"
          echo "Build URL: $BUILD_URL"
          echo "build_url=$BUILD_URL" >> "$GITHUB_OUTPUT"
          echo "build_num=$BUILD_NUM" >> "$GITHUB_OUTPUT"

      - name: Wait for Jenkins build to complete
        id: wait
        shell: bash
        env:
          JENKINS_USER: ${{ vars.JENKINS_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_TOKEN }}
        run: |
          set -euo pipefail

          BUILD_URL="${{ steps.trigger.outputs.build_url }}"
          BUILD_NUM="${{ steps.trigger.outputs.build_num }}"

          echo "Waiting for build #$BUILD_NUM to complete..."

          # Poll for completion (max 15 minutes)
          RESULT=""
          for i in $(seq 1 90); do
            RESULT=$(curl -sS -u "$JENKINS_USER:$JENKINS_TOKEN" "${BUILD_URL}api/json" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('result') or '')")
            [ -n "$RESULT" ] && break
            echo "Still running... (attempt $i/90)"
            sleep 10
          done

          if [ -z "$RESULT" ]; then
            echo "Timeout waiting for build to complete"
            echo "result=TIMEOUT" >> "$GITHUB_OUTPUT"
          else
            echo "Build completed: $RESULT"
            echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          fi

      - name: Report results
        shell: bash
        run: |
          RESULT="${{ steps.wait.outputs.result }}"
          BUILD_NUM="${{ steps.trigger.outputs.build_num }}"
          BUILD_URL="${{ steps.trigger.outputs.build_url }}"

          echo "=========================================="
          echo "UI Smoke Test Result: $RESULT"
          echo "Jenkins Build: #$BUILD_NUM"
          echo "Build URL: $BUILD_URL"
          echo "=========================================="

          if [ "$RESULT" != "SUCCESS" ]; then
            echo "UI smoke tests failed!"
            exit 1
          fi

          echo "UI smoke tests passed!"

      - name: Approve PR on success
        if: success() && github.event_name == 'pull_request'
        shell: bash
        run: |
          curl -s -k -X POST \
            "https://gitea.homelab.local/api/v1/repos/nextdevops/XferDB/pulls/${{ github.event.pull_request.number }}/reviews" \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"body\":\"UI smoke tests passed: ${{ steps.trigger.outputs.build_url }}\",\"event\":\"APPROVE\"}"

      - name: Request changes on failure
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        run: |
          curl -s -k -X POST \
            "https://gitea.homelab.local/api/v1/repos/nextdevops/XferDB/pulls/${{ github.event.pull_request.number }}/reviews" \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"body\":\"UI smoke tests failed (result: ${{ steps.wait.outputs.result }}): ${{ steps.trigger.outputs.build_url }}\",\"event\":\"REQUEST_REVIEW\"}"
