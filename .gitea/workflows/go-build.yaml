name: Build

on:
  push:
    branches:
      - main
      - '**'
    paths:
      - '**.go'
  pull_request:
    paths:
      - '**.go'
  workflow_dispatch:

jobs:
  build:
    runs-on: rocky9.8
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        env:
          GIT_SSL_NO_VERIFY: "true"

      - name: Build and test
        shell: bash
        run: |
          set -eu
          go version

          echo "Fixing dependencies..."
          go mod tidy

          echo "Downloading dependencies..."
          go mod download

          echo "Building..."
          go build -v ./...

          echo "Running tests..."
          go test -v ./...
