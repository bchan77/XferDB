name: Build

on:
  pull_request:
    paths:
      - '**.go'
  workflow_dispatch:

jobs:
  build:
    runs-on: rocky9.8
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        env:
          GIT_SSL_NO_VERIFY: "true"

      - name: Install build dependencies
        shell: bash
        run: |
          dnf install -y gcc

      - name: Build and test
        id: build
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          set -eu
          go version

          echo "Fixing dependencies..."
          go mod tidy

          echo "Downloading dependencies..."
          go mod download

          echo "Building..."
          go build -v ./...

          echo "Running tests..."
          go test -v ./...

      # Report the result as a PR comment rather than an approving review:
      # Gitea refuses "approve your own pull" (422), so a review only works
      # when the CI token and the PR author are different accounts. A comment
      # always posts. Merge gating is the check status, not this.
      - name: Comment result on PR
        if: success() && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          resp=$(curl -sS -k -w '\n%{http_code}' -X POST \
            "https://gitea.homelab.local/api/v1/repos/nextdevops/XferDB/issues/${{ github.event.pull_request.number }}/comments" \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"body":"Build and tests passed."}')
          status="${resp##*$'\n'}"
          echo "${resp%$'\n'*}"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Posting the result comment failed (HTTP $status)"
            exit 1
          fi

      - name: Comment failure on PR
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          resp=$(curl -sS -k -w '\n%{http_code}' -X POST \
            "https://gitea.homelab.local/api/v1/repos/nextdevops/XferDB/issues/${{ github.event.pull_request.number }}/comments" \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"body":"Build or tests failed."}')
          status="${resp##*$'\n'}"
          echo "${resp%$'\n'*}"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Posting the result comment failed (HTTP $status)"
            exit 1
          fi
