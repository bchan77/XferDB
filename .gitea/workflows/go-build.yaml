name: Build

on:
  pull_request:
    paths:
      - '**.go'
  workflow_dispatch:

jobs:
  build:
    runs-on: rocky9.8
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        env:
          GIT_SSL_NO_VERIFY: "true"

      - name: Install build dependencies
        shell: bash
        run: |
          dnf install -y gcc

      - name: Build and test
        id: build
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: |
          set -eu
          go version

          echo "Fixing dependencies..."
          go mod tidy

          echo "Downloading dependencies..."
          go mod download

          echo "Building..."
          go build -v ./...

          echo "Running tests..."
          go test -v ./...

      - name: Approve PR on success
        if: success()
        shell: bash
        run: |
          echo "Approving PR..."
          PR_NUM="${{ github.event.pull_request.number }}"
          curl -s -k -X POST \
            "https://gitea.homelab.local/api/v1/repos/nextdevops/XferDB/pulls/${PR_NUM}/reviews" \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"body":"Build passed","event":"APPROVE"}'

      - name: Request changes on PR on failure
        if: failure()
        shell: bash
        run: |
          echo "Requesting changes on PR..."
          PR_NUM="${{ github.event.pull_request.number }}"
          curl -s -k -X POST \
            "https://gitea.homelab.local/api/v1/repos/nextdevops/XferDB/pulls/${PR_NUM}/reviews" \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"body":"Build failed","event":"REQUEST_REVIEW"}'
