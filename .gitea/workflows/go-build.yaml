name: Build

on:
  push:
    branches:
      - main
      - '**'
    paths:
      - '**.go'
  pull_request:
    paths:
      - '**.go'
  workflow_dispatch:

jobs:
  build:
    runs-on: kubernetes
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        env:
          GIT_SSL_NO_VERIFY: "true"

      - name: Download and install Go
        shell: sh
        run: |
          set -eu
          GO_VERSION="1.22.5"
          curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tar.gz
          rm -rf /usr/local/go
          tar -C /usr/local -xzf /tmp/go.tar.gz
          rm -f /tmp/go.tar.gz
          /usr/local/go/bin/go version

      - name: Set up Go environment
        shell: sh
        run: |
          set -eu
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          go version

      - name: Download dependencies
        shell: sh
        run: |
          set -eu
          go mod download

      - name: Build
        shell: sh
        run: |
          set -eu
          go build -v ./...

      - name: Run tests
        shell: sh
        run: |
          set -eu
          go test -v ./...
