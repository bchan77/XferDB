name: XferDB Matrix Gate

# Every push and every PR against XferDB triggers the real compatibility
# matrix (Jenkins job xferdb-matrix, SIZE=S) instead of just the Go unit
# tests in go-build.yaml. On a pull_request, the PR is approved when it
# passes and sent back for changes when it doesn't — mirroring go-build.yaml's
# own approve/request-changes pattern, just gated on the heavier matrix run.

on:
  push:
    paths:
      - '**.go'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.go'
  workflow_dispatch:

jobs:
  matrix-gate:
    runs-on: rocky9.8
    timeout-minutes: 260

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        env:
          GIT_SSL_NO_VERIFY: "true"

      - name: Install polling dependencies
        shell: bash
        run: |
          dnf install -y python3 >/dev/null

      - name: Trigger xferdb-matrix (SIZE=S) and wait for result
        id: matrix
        shell: bash
        env:
          JENKINS_URL: ${{ vars.JENKINS_URL }}
          JENKINS_USER: ${{ vars.JENKINS_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_TOKEN }}
          XFERDB_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail

          resp=$(curl -sS -i -u "$JENKINS_USER:$JENKINS_TOKEN" \
            -X POST "$JENKINS_URL/job/NextDevOps/job/XferDB/job/xferdb-matrix/buildWithParameters" \
            --data-urlencode "XFERDB_REF=$XFERDB_REF" \
            --data-urlencode "SIZE=S")
          queue_url=$(printf '%s' "$resp" | grep -i '^Location:' | awk '{print $2}' | tr -d '\r')
          if [ -z "$queue_url" ]; then
            echo "Could not read a queue URL from the Jenkins trigger response:"
            printf '%s\n' "$resp"
            exit 1
          fi
          echo "Queued: $queue_url"

          # Resolve the queue item to a real build number/URL once Jenkins
          # schedules it (it isn't buildable immediately if the job is busy).
          build_url=""
          for i in $(seq 1 60); do
            build_url=$(curl -sS -u "$JENKINS_USER:$JENKINS_TOKEN" "${queue_url}api/json" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print((d.get('executable') or {}).get('url',''))")
            [ -n "$build_url" ] && break
            sleep 5
          done
          if [ -z "$build_url" ]; then
            echo "Timed out waiting for the build to leave the Jenkins queue"
            exit 1
          fi
          echo "Build: $build_url"
          echo "build_url=$build_url" >> "$GITHUB_OUTPUT"

          # Poll until the build has a final result. xferdb-matrix's own
          # pipeline timeout is 240 minutes; this loop covers a bit more.
          result=""
          for i in $(seq 1 500); do
            result=$(curl -sS -u "$JENKINS_USER:$JENKINS_TOKEN" "${build_url}api/json" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('result') or '')")
            [ -n "$result" ] && break
            sleep 30
          done
          echo "Result: $result"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          [ "$result" = "SUCCESS" ]

      - name: Approve PR on success
        if: success() && github.event_name == 'pull_request'
        shell: bash
        run: |
          curl -s -k -X POST \
            "https://gitea.homelab.local/api/v1/repos/nextdevops/XferDB/pulls/${{ github.event.pull_request.number }}/reviews" \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"body\":\"xferdb-matrix (SIZE=S) passed: ${{ steps.matrix.outputs.build_url }}\",\"event\":\"APPROVE\"}"

      - name: Request changes on PR on failure
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        run: |
          curl -s -k -X POST \
            "https://gitea.homelab.local/api/v1/repos/nextdevops/XferDB/pulls/${{ github.event.pull_request.number }}/reviews" \
            -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"body\":\"xferdb-matrix (SIZE=S) did not pass (result: ${{ steps.matrix.outputs.result }}): ${{ steps.matrix.outputs.build_url }}\",\"event\":\"REQUEST_REVIEW\"}"
